name: Deploy Next.js and SSL to Cloud.ru VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Prepare server directories
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: user1
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo mkdir -p /var/www/azimut-school
            sudo chown -R user1:user1 /var/www/azimut-school

      - name: Deploy static files to Server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: user1
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: 'out/*'
          target: '/var/www/azimut-school'
          strip_components: 1

      - name: Write SSL certificates on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: user1
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo mkdir -p /etc/ssl/certs /etc/ssl/private
            sudo bash -c 'cat > /etc/ssl/certs/fullchain.pem << "CERT_EOF"
            ${{ secrets.SSL_CERT }}
            CERT_EOF'
            sudo bash -c 'cat > /etc/ssl/private/privkey.pem << "KEY_EOF"
            ${{ secrets.SSL_KEY }}
            KEY_EOF'
            sudo chmod 644 /etc/ssl/certs/fullchain.pem
            sudo chmod 600 /etc/ssl/private/privkey.pem

      - name: Install and configure Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: user1
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo apt-get update && sudo apt-get install -y nginx
            sudo bash -c 'cat > /etc/nginx/sites-available/default << "NGINX_EOF"
            server {
                listen 80;
                listen [::]:80;
                server_name azimut-school.ru www.azimut-school.ru;
                return 301 https://azimut-school.ru$request_uri;
            }

            server {
                listen 443 ssl;
                listen [::]:443 ssl;
                server_name azimut-school.ru www.azimut-school.ru;

                ssl_certificate /etc/ssl/certs/fullchain.pem;
                ssl_certificate_key /etc/ssl/private/privkey.pem;

                ssl_protocols TLSv1.2 TLSv1.3;
                ssl_prefer_server_ciphers on;

                root /var/www/azimut-school;
                index index.html;

                location / {
                    try_files $uri $uri/ $uri.html =404;
                }

                location /_next/static/ {
                    alias /var/www/azimut-school/_next/static/;
                    expires 365d;
                    access_log off;
                }
            }
            NGINX_EOF'
            sudo nginx -t && sudo systemctl restart nginx
