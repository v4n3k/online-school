name: Deploy Next.js SSG to Cloud.ru

on:
  push:
    branches:
      - main # Укажите вашу ветку, если это master или другая

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # Исправили опечатку в ключе и обновили версию Node
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ru-central1
          audience: https://cloud.ru # Явно указываем аудиторию для S3
          skip-credentials-validation: true # Отключаем проверку через несуществующий STS AWS

      - name: Deploy to Cloud.ru S3
        run: |
          aws s3 sync out/ s3://azimut-school.ru --endpoint-url=https://cloud.ru --delete
