name: Deploy Next.js SSG to Cloud.ru

on:
  push:
    branches:
      - main # Если ваша ветка называется master, замените main на master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Deploy to Cloud.ru S3
        run: |
          aws s3 sync out/ s3://azimut-school.ru \
            --endpoint-url=https://s3.cloud.ru \
            --region=ru-central-1 \
            --delete
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
