name: Deploy Next.js and SSL to Cloud.ru VPS

on:
  push:
    branches:
      - main # Напишите master, если ваша ветка называется master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Deploy static files to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: user1
          password: ${{ secrets.SERVER_PASSWORD }}
          source: 'out/*'
          target: '/var/www/azimut-school'
          strip_components: 1

      - name: Configure SSL and Nginx on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: user1
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            # Записываем сертификаты во временную папку
            echo "${{ secrets.SSL_CERT }}" > /tmp/fullchain.pem
            echo "${{ secrets.SSL_KEY }}" > /tmp/privkey.pem

            # Переносим их в системные папки с правами sudo
            sudo mv /tmp/fullchain.pem /etc/ssl/certs/fullchain.pem
            sudo mv /tmp/privkey.pem /etc/ssl/private/privkey.pem

            # Устанавливаем Nginx, если его еще нет
            sudo apt-get update && sudo apt-get install -y nginx

            # Создаем конфигурацию сайта
            sudo bash -c 'cat << "EOF" > /etc/nginx/sites-available/default
            server {
                listen 80;
                listen [::]:80;
                server_name azimut-school.ru www.azimut-school.ru;
                return 301 https://azimut-school.ru$request_uri;
            }

            server {
                listen 443 ssl;
                listen [::]:443 ssl;
                server_name azimut-school.ru www.azimut-school.ru;

                ssl_certificate /etc/ssl/certs/fullchain.pem;
                ssl_certificate_key /etc/ssl/private/privkey.pem;

                ssl_protocols TLSv1.2 TLSv1.3;
                ssl_prefer_server_ciphers on;

                root /var/www/azimut-school;
                index index.html;

                location / {
                    try_files $uri $uri/ $uri.html =404;
                }

                location /_next/static/ {
                    alias /var/www/azimut-school/_next/static/;
                    expires 365d;
                    access_log off;
                }
            }
            EOF'

            # Настраиваем права папки сайта и перезапускаем Nginx
            sudo mkdir -p /var/www/azimut-school
            sudo chown -R user1:user1 /var/www/azimut-school
            sudo nginx -t && sudo systemctl restart nginx
