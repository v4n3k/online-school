name: Deploy Next.js SSG to Yandex Cloud S3

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Deploy to Yandex Cloud S3
        uses: jakejarvis/s3-sync-action@master
        with:
          args: --acl public-read --follow-symlinks --delete
        env:
          AWS_S3_BUCKET: 'azimut-school-static'
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_KEY }}
          AWS_REGION: 'ru-central1'
          AWS_S3_ENDPOINT: 'https://storage.yandexcloud.net'
          SOURCE_DIR: 'out'

      # S3 sync does not invalidate the CDN, so /index.html keeps serving the
      # previous build until the cached entry expires. An empty "paths" array
      # purges the resource entirely - purging a single path is not enough here.
      - name: Purge CDN cache
        env:
          YC_PURGE_SA_KEY: ${{ secrets.YC_PURGE_SA_KEY }}
          YC_CDN_RESOURCE_ID: ${{ vars.YC_CDN_RESOURCE_ID }}
        run: |
          set -euo pipefail

          printf '%s' "$YC_PURGE_SA_KEY" > sa-key.json

          read -r KEY_ID SA_ID < <(python3 -c '
          import json
          k = json.load(open("sa-key.json"))
          open("sa-key.pem", "w").write(k["private_key"])
          print(k["id"], k["service_account_id"])
          ')

          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }

          iat=$(date +%s)
          exp=$((iat + 3600))
          header=$(printf '{"alg":"PS256","typ":"JWT","kid":"%s"}' "$KEY_ID" | b64url)
          payload=$(printf '{"aud":"https://iam.api.cloud.yandex.net/iam/v1/tokens","iss":"%s","sub":"%s","iat":%s,"exp":%s}' \
            "$SA_ID" "$KEY_ID" "$iat" "$exp" | b64url)
          signing_input="$header.$payload"
          signature=$(printf '%s' "$signing_input" \
            | openssl dgst -sha256 -sigopt rsa_padding_mode:pss -sigopt rsa_pss_saltlen:-1 -sign sa-key.pem \
            | b64url)

          TOKEN=$(curl -sf --max-time 30 -X POST 'https://iam.api.cloud.yandex.net/iam/v1/tokens' \
            -H 'Content-Type: application/json' \
            -d "{\"jwt\":\"$signing_input.$signature\"}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["iamToken"])')

          # the API allows one purge operation per minute
          for attempt in 1 2 3; do
            if response=$(curl -s --max-time 30 -X POST \
              "https://cdn.api.cloud.yandex.net/cdn/v1/cache/${YC_CDN_RESOURCE_ID}:purge" \
              -H "Authorization: Bearer $TOKEN" \
              -H 'Content-Type: application/json' \
              -d '{"paths":[]}'); then

              case "$response" in
                *'"error"'*)
                  if grep -q 'limit per minute' <<<"$response"; then
                    echo "Rate limited, retrying in 65s (attempt $attempt/3)"
                    sleep 65
                    continue
                  fi
                  echo "$response"
                  exit 1
                  ;;
                *'"done":true'*|*'"done": true'*)
                  echo "$response"
                  echo 'CDN cache purged'
                  exit 0
                  ;;
              esac

              echo "$response"
              exit 1
            fi

            echo 'purge request failed'
            exit 1
          done

          echo 'CDN cache purge failed after 3 attempts'
          exit 1
